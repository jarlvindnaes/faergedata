name: Færgedata snapshot

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent snapshot
        run: python scraper/fetch_snapshot.py

      - name: Byg datasæt til dashboard
        run: python scraper/build_dataset.py

      - name: Commit og push
        run: |
          git config user.name "faergedata-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data.json
          git diff --cached --quiet && echo "Ingen ændringer" && exit 0
          git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
